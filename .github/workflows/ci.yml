name: CI

# Branches run CI through their pull request. Reason: a push to a branch with
# an open pull request would otherwise start two runs.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Versions match mise.toml.
env:
  NODE_VERSION: "26"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: permishly
          POSTGRES_PASSWORD: permishly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permishly"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop
      - name: Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - name: bundler-audit
        run: bin/bundler-audit
      - name: Sorbet
        run: bin/srb tc
      - name: Gem RBIs are current
        run: bin/tapioca gem --verify
      - name: Prepare database
        run: bin/rails db:prepare
      # Needs the database: tapioca reads the columns of each model.
      - name: DSL RBIs are current
        run: bin/tapioca dsl --verify
      - name: RSpec
        run: bundle exec rspec

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build

  # Browser tests against the real API and the development database with demo data.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: permishly
          POSTGRES_PASSWORD: permishly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U permishly"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare database
        working-directory: backend
        run: bin/rails db:prepare
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
