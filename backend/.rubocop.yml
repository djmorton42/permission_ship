# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-sorbet

AllCops:
  NewCops: enable
  Exclude:
    # Generated by tapioca.
    - sorbet/rbi/**/*

# Sorbet strictness for each directory. See "Types" in ../architecture.md.
Sorbet/StrictSigil:
  Enabled: true
  Include:
    - app/**/*.rb
    - lib/**/*.rb
    - sorbet/tapioca/compilers/**/*.rb
Sorbet/FalseSigil:
  Include:
    - config/**/*.rb
    - spec/**/*.rb
# Specs are typed: false. RSpec helper methods are defined in blocks.
Sorbet/BlockMethodDefinition:
  Exclude:
    - spec/**/*
Sorbet/ForbidTUntyped:
  Enabled: true
  Include:
    - app/**/*.rb
    - lib/**/*.rb
Sorbet/ForbidTUnsafe:
  Enabled: true
  Include:
    - app/**/*.rb
    - lib/**/*.rb

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false
